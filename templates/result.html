
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomatoSentinel - Analysis Result</title>

    <style>
        body {
            background: #050505;
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 60px;
            margin: 0;
        }

        .main {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        .left {
            width: 40%;
        }

        .left img {
            width: 100%;
            border: 2px solid #7dff00;
            box-sizing: border-box;
            border-radius: 8px;
        }

        .again {
            display: block;
            width: 100%;
            margin-top: 25px;
            background: #7dff00;
            color: black;
            padding: 18px 0;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .right {
            width: 60%;
        }

        h1 {
            font-size: 60px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .green {
            color: #9dff00;
        }

        .confidence {
            font-size: 26px;
            margin-bottom: 30px;
        }

        .bar {
            width: 100%;
            height: 20px;
            background: #222;
            margin-bottom: 50px;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: {{ confidence }}%;
            background: #7dff00;
        }

        .prediction {
            font-size: 48px;
            color: #9dff00;
            margin-bottom: 30px;
            font-weight: 800;
        }

        @media (max-width: 768px) {
            body {
                padding: 24px;
            }

            .main {
                flex-direction: column;
                gap: 30px;
            }

            .left, .right {
                width: 100%;
            }

            h1 {
                font-size: 38px;
            }

            .prediction {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="left">
            {% if image_data %}
                <img src="{{ image_data }}" alt="Uploaded tomato leaf">
            {% else %}
                <p>Uploaded image preview is unavailable.</p>
            {% endif %}

            <a href="/upload" class="again">Analyze Again</a>
        </div>

        <div class="right">
            <h1>AI Analysis <span class="green">Dashboard</span></h1>

            <div class="prediction">{{ prediction }}</div>

            <div class="confidence">
                Confidence Score: {{ confidence }}%
            </div>

            <div class="bar">
                <div class="fill"></div>
            </div>
        </div>
    </div>
</body>
</html>
