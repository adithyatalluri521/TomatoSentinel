<!DOCTYPE html>
<html>
<head>
    <title>Tomato Sentinel AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI;
        }

        body{
            background:#050505;
            color:white;
        }

        nav{
            width:100%;
            padding:25px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .logo{
            font-size:42px;
            font-weight:800;
            color:#9dff00;
        }

        .menu{
            display:flex;
            gap:50px;
        }

        .menu a{
            color:#ddd;
            text-decoration:none;
            letter-spacing:2px;
            font-size:14px;
        }

        .hero{
            width:100%;
            min-height:90vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:60px;
        }

        .left{
            width:50%;
        }

        .tag{
            border:1px solid #5aff00;
            color:#a6ff00;
            display:inline-block;
            padding:12px 22px;
            margin-bottom:35px;
            letter-spacing:3px;
            font-size:13px;
        }

        .title{
            font-size:95px;
            font-weight:900;
            line-height:1;
            margin-bottom:30px;
        }

        .green{
            color:#9dff00;
        }

        .desc{
            color:#9d9d9d;
            font-size:22px;
            line-height:1.8;
            width:80%;
            margin-bottom:40px;
        }

        .buttons{
            display:flex;
            gap:20px;
            margin-bottom:50px;
        }

        .scan-btn{
            background:#7dff00;
            color:black;
            padding:18px 35px;
            border:none;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
            text-decoration:none;
        }

        .how-btn{
            border:1px solid #555;
            color:white;
            padding:18px 30px;
            font-size:16px;
            text-decoration:none;
        }

        .stats{
            display:flex;
            gap:60px;
        }

        .stats h1{
            color:#9dff00;
            font-size:60px;
        }

        .stats p{
            color:#8b8b8b;
            margin-top:10px;
        }

        .right{
            width:50%;
            display:flex;
            justify-content:center;
        }

        .card{
            width:500px;
            height:500px;
            border:1px solid rgba(157,255,0,0.2);
            background:#0b0b0b;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
        }

        .card img{
            width:220px;
            margin-bottom:30px;
        }

        .line{
            width:280px;
            height:6px;
            background:#222;
            margin:10px 0;
            overflow:hidden;
        }

        .line span{
            display:block;
            height:100%;
            background:#7dff00;
        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            Tomato Sentinel
        </div>

        <div class="menu">
            <a href="#">DETECT</a>
            <a href="#">DISEASES</a>
            <a href="#">TECHNOLOGY</a>
            <a href="#">TRAINING</a>
            <a href="#">API</a>
        </div>

    </nav>

    <section class="hero">

        <div class="left">

            <div class="tag">
                AI POWERED PLANT PATHOLOGY
            </div>

            <div class="title">
                Detect <span class="green">Crop Disease</span> Instantly
            </div>

            <div class="desc">
                Upload tomato leaf images and our advanced AI model will analyze plant diseases with intelligent recommendations.
            </div>

            <div class="buttons">

                <a href="/upload" class="scan-btn">
                    Scan Your Crop
                </a>

                <a href="#" class="how-btn">
                    How It Works
                </a>

            </div>

            <div class="stats">

                <div>
                    <h1>98%</h1>
                    <p>Accuracy</p>
                </div>

                <div>
                    <h1>24/7</h1>
                    <p>Detection</p>
                </div>

                <div>
                    <h1>AI</h1>
                    <p>Powered</p>
                </div>

            </div>

        </div>

        <div class="right">

            <div class="card">

                <img src="https://cdn-icons-png.flaticon.com/512/2909/2909762.png">

                <div class="line">
                    <span style="width:82%"></span>
                </div>

                <div class="line">
                    <span style="width:61%"></span>
                </div>

                <div class="line">
                    <span style="width:32%"></span>
                </div>

            </div>

        </div>

    </section>

</body>
</html>
